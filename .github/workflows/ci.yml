name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify dotfiles
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Isolate the native package prefix
        shell: bash
        run: |
          set -u
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          if [[ -e /opt/homebrew ]]; then
            sudo mv /opt/homebrew "$RUNNER_TEMP/preinstalled-homebrew"
          fi
          printf '%s\n' "$HOME/.local/bin" /opt/homebrew/bin /opt/homebrew/sbin >> "$GITHUB_PATH"

      - name: Install official mise
        shell: bash
        run: /bin/bash bootstrap/install-mise.sh

      - name: Provision verification tools through mise
        shell: bash
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_YES: 1
        run: |
          set -u
          mise trust --yes
          mise install --yes
          mise bootstrap packages apply --yes
          if command -v brew || command -v stow; then
            echo 'The verification environment must not contain Homebrew or Stow.' >&2
            exit 1
          fi

      - name: Run verification
        shell: bash
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_YES: 1
        run: mise run verify
