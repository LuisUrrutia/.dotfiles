version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(actions)
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
