[bootstrap.repos]
"~/Projects/LuisUrrutia/skills" = { url = "https://github.com/LuisUrrutia/skills.git" }

[tools]
"npm:skills" = "latest"

[tasks."setup:skills"]
depends = ["skills:link"]
run = 'bash "{{ config_root }}/setup.sh"'

[tasks."skills:link"]
description = "Link personal skills from their development checkout"
run = 'fish --no-config "{{ config_root }}/link.fish"'
