[doctor.checks.filevault]
description = "FileVault is enabled"
run = "/usr/bin/fdesetup status | /usr/bin/grep -q 'FileVault is On'"
hint = "Enable FileVault in System Settings and store its recovery key in 1Password."
timeout = "5s"
os = "macos"

[doctor.checks.screen-lock]
description = "The screen locks immediately"
run = 'bash "${MISE_CONFIG_DIR:-$HOME/.config/mise}/conf.d/macos/screen-lock.sh" check'
hint = "Run ./install.sh from the public checkout to configure immediate screen locking."
timeout = "5s"
os = "macos"

[bootstrap.hooks]
post-defaults = 'if pgrep -u "$(id -u)" -x Dock >/dev/null; then killall -u "$(id -un)" Dock; fi'

[bootstrap.macos.dock]
apps = [
  "/System/Applications/Messages.app",
  "/System/Applications/Notes.app",
  "/Applications/Ghostty.app",
  "/Applications/Zed.app",
  "/Applications/T3 Code (Nightly).app",
  "/Applications/Dia.app",
  "/System/Applications/App Store.app",
  "/System/Applications/System Settings.app",
]
autohide = true
tilesize = 55
mru_spaces = false

[bootstrap.directories."~/Pictures/Screenshots"]
os = "macos"

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = false
key_repeat = 1
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.finder]
show_all_files = true
show_extensions_warning = false
sort_folders_first = true
preferred_view_style = "list"
show_pathbar = true
show_status_bar = true

[bootstrap.macos.defaults."NSGlobalDomain"]
