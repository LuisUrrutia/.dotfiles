
[tools]
jq = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"
"aqua:ollama/ollama" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
"npm:2password" = { version = "latest", allow_low_downloads = true }
"npm:@playwright/cli" = { version = "latest", trust_policy_excludes = [
  "@playwright/cli@0.1.19",
  "playwright@1.63.0-alpha-2026-08-31",
  "playwright-core@1.63.0-alpha-2026-08-31",
] }
"npm:chrome-devtools-mcp" = "latest"
"npm:@code-yeongyu/comment-checker" = "latest"
"npm:clawpatch" = "latest"
"pipx:httpie" = "latest"
"pipx:pre-commit" = { version = "latest", uvx_args = "--with pre-commit-uv" }

[tools."npm:@luisurrutia/bird"]
version = "latest"
minimum_release_age = "0s"
allow_low_downloads = true
trust_policy_excludes = ["@luisurrutia/bird"]
allow_builds = ["@luisurrutia/bird"]
allow_exotic_deps = ["@luisurrutia/bird"]
