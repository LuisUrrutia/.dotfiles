[dotfiles]
"~/.config/nvim/init.lua" = "init.lua"
"~/.config/nvim/lazy-lock.json" = "lazy-lock.json"
"~/.config/nvim/lua" = { source = "lua", mode = "symlink-each" }
"~/.config/nvim/stylua.toml" = "stylua.toml"

[tools]
"aqua:tree-sitter/tree-sitter" = "latest"
rust-analyzer = "latest"
lua-language-server = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:@astrojs/language-server" = "latest"
"npm:@vtsls/language-server" = "latest"
"github:docker/docker-language-server" = { version = "latest", rename_exe = "docker-language-server" }
# Astro needs the JavaScript SDK removed in TypeScript 7.
"npm:typescript" = "6"

[tasks."setup:nvim"]
run = 'bash "{{ config_root }}/setup.sh"'
